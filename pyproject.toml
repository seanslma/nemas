[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "nemas"
dynamic = ["version"]
description = "National Electricity Market Analytics System (NEMAS)"
authors = [
    {name = "Sean Ma", email = "sean.sl.ma@gmail.com"},
]
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}

classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
]

dependencies = [
    "numpy",
    "pandas",
    "polars",
]

[tool.hatch.version]
source = "vcs"

[tool.hatch.build]
exclude = [
    "conda_*",
    "**/conda_*",
]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.format]
preview = false
quote-style = "single"
